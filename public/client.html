<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AudioLog - Client</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <a href="dashboard.html">&larr; Back</a>
            <h1 id="client-name"></h1>
        </header>

        <main>
            <section id="projects-section">
                <h2>Projects</h2>
                <button id="add-project">+ Add project</button>
                <div id="new-project-form" style="display:none">
                    <input type="text" id="project-name-input" placeholder="Project name">
                    <select id="project-type-input">
                        <option value="">-- Select type --</option>
                        <option value="Film">Film</option>
                        <option value="Atmos">Atmos</option>
                        <option value="Mix">Mix</option>
                        <option value="Master">Master</option>
                        <option value="Recording">Recording</option>
                        <option value="General">General</option>
                    </select>
                    <button id="save-project">Save</button>
                    <button id="cancel-project">Cancel</button>
                </div>
                <ul id="projects-list"></ul>
            </section>
        </main>

        <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
        <script src="client.js"></script>

    </body>
</html>
